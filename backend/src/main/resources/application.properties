# Cấu hình ứng dụng Spring Boot
spring.application.name=todo-backend

# Cấu hình server
server.port=8080

# Cấu hình Database PostgreSQL
# URL kết nối đến PostgreSQL database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tododb}
# Username để kết nối database
spring.datasource.username=${DB_USERNAME:postgres}
# Password để kết nối database
spring.datasource.password=${DB_PASSWORD:postgres}
# Driver class cho PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA/Hibernate
# Tự động cập nhật schema database khi có thay đổi
spring.jpa.hibernate.ddl-auto=update
# Hiển thị SQL queries trong console (hữu ích cho debug)
spring.jpa.show-sql=true
# Format SQL queries cho dễ đọc
spring.jpa.properties.hibernate.format_sql=true
# Sử dụng PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cấu hình CORS - Cho phép Frontend kết nối
# Trong production nên chỉ định rõ domain của frontend
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
