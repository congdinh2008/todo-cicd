name: CD - Deploy

# Workflow này sẽ chạy khi có push tag hoặc manual trigger
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # Job build và push Docker images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub (nếu sử dụng Docker Hub)
      # Uncomment và thêm secrets: DOCKER_USERNAME, DOCKER_PASSWORD
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # Get version từ tag hoặc commit SHA
      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=sha-${GITHUB_SHA::8}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Build và push backend image
      - name: Build and push backend image
        run: |
          docker build -t todo-backend:${{ steps.version.outputs.VERSION }} ./backend
          docker tag todo-backend:${{ steps.version.outputs.VERSION }} todo-backend:latest
          # Uncomment để push lên Docker Hub
          # docker push todo-backend:${{ steps.version.outputs.VERSION }}
          # docker push todo-backend:latest

      # Build và push frontend image
      - name: Build and push frontend image
        run: |
          docker build -t todo-frontend:${{ steps.version.outputs.VERSION }} ./frontend
          docker tag todo-frontend:${{ steps.version.outputs.VERSION }} todo-frontend:latest
          # Uncomment để push lên Docker Hub
          # docker push todo-frontend:${{ steps.version.outputs.VERSION }}
          # docker push todo-frontend:latest

  # Job deploy (placeholder - cần cấu hình theo môi trường thực tế)
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Deploy sẽ phụ thuộc vào môi trường cụ thể
      # Ví dụ: SSH vào server và chạy docker-compose
      # - name: Deploy to server
      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USERNAME }}
      #     key: ${{ secrets.SERVER_SSH_KEY }}
      #     script: |
      #       cd /path/to/app
      #       docker-compose pull
      #       docker-compose up -d

      - name: Deployment placeholder
        run: |
          echo "Deployment to ${{ github.event.inputs.environment || 'staging' }} would happen here"
          echo "Configure deployment based on your infrastructure"
